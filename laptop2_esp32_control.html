<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Control Panel - Laptop 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }
        .section h2 {
            color: #374151;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-red {
            background: #ef4444;
            color: white;
        }
        .btn-red:hover {
            background: #dc2626;
        }
        .btn-green {
            background: #10b981;
            color: white;
        }
        .btn-green:hover {
            background: #059669;
        }
        .btn-yellow {
            background: #f59e0b;
            color: white;
        }
        .btn-yellow:hover {
            background: #d97706;
        }
        .btn-blue {
            background: #3b82f6;
            color: white;
        }
        .btn-blue:hover {
            background: #2563eb;
        }
        .status-box {
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin: 10px 0;
            border: 2px solid #e5e7eb;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }
        .label {
            font-weight: 600;
            color: #374151;
        }
        .value {
            color: #6b7280;
            font-family: 'Courier New', monospace;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
        }
        .log {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-entry {
            margin: 5px 0;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 ESP32 Control Panel</h1>
        <p class="subtitle">Laptop 2 → ESP32 (192.168.100.10:8080)</p>

        <!-- LED Controls -->
        <div class="section">
            <h2>💡 LED Controls</h2>
            <div class="button-group">
                <button class="btn-red" onclick="sendCommand('led', 'red_on')">🔴 Red ON</button>
                <button class="btn-red" onclick="sendCommand('led', 'red_off')">⚫ Red OFF</button>
                <button class="btn-green" onclick="sendCommand('led', 'green_on')">🟢 Green ON</button>
                <button class="btn-green" onclick="sendCommand('led', 'green_off')">⚫ Green OFF</button>
                <button class="btn-yellow" onclick="sendCommand('led', 'yellow_on')">🟡 Yellow ON</button>
                <button class="btn-yellow" onclick="sendCommand('led', 'yellow_off')">⚫ Yellow OFF</button>
            </div>
            <div class="button-group">
                <button class="btn-blue" onclick="sendCommand('all_leds', 'on')">💡 All ON</button>
                <button class="btn-blue" onclick="sendCommand('all_leds', 'off')">🌑 All OFF</button>
            </div>
        </div>

        <!-- Buzzer Controls -->
        <div class="section">
            <h2>🔊 Buzzer Controls</h2>
            <div class="button-group">
                <button class="btn-blue" onclick="sendCommand('buzzer', 'beep')">🔔 Beep (3x)</button>
                <button class="btn-blue" onclick="sendCommand('buzzer', 'long_beep')">📢 Long Beep</button>
            </div>
        </div>

        <!-- Device Status -->
        <div class="section">
            <h2>📊 Device Status</h2>
            <button class="btn-blue" onclick="getStatus()">🔄 Refresh Status</button>
            <div id="statusBox" class="status-box">
                <div class="status-item">
                    <span class="label">Status:</span>
                    <span class="value" id="status">-</span>
                </div>
                <div class="status-item">
                    <span class="label">Device ID:</span>
                    <span class="value" id="deviceId">-</span>
                </div>
                <div class="status-item">
                    <span class="label">Uptime:</span>
                    <span class="value" id="uptime">-</span>
                </div>
                <div class="status-item">
                    <span class="label">Free Memory:</span>
                    <span class="value" id="memory">-</span>
                </div>
            </div>
        </div>

        <!-- Sensor Data -->
        <div class="section">
            <h2>🌡️ Sensor Data</h2>
            <button class="btn-blue" onclick="getSensorData()">🔄 Read Sensors</button>
            <div id="sensorBox" class="status-box">
                <div class="status-item">
                    <span class="label">Temperature:</span>
                    <span class="value" id="temperature">-</span>
                </div>
                <div class="status-item">
                    <span class="label">Humidity:</span>
                    <span class="value" id="humidity">-</span>
                </div>
            </div>
        </div>

        <!-- Custom Data -->
        <div class="section">
            <h2>📤 Send Custom Data</h2>
            <textarea id="customData" placeholder='{"type": "measurement", "value": 123.45, "unit": "kg"}'></textarea>
            <button class="btn-blue" onclick="sendCustomData()">📨 Send Data</button>
        </div>

        <!-- Activity Log -->
        <div class="section">
            <h2>📝 Activity Log</h2>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const ESP32_URL = 'http://192.168.100.10:8080';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : 'success';
            logDiv.innerHTML = `<div class="log-entry ${className}">[${timestamp}] ${message}</div>` + logDiv.innerHTML;
        }

        async function sendCommand(command, action) {
            try {
                log(`Sending command: ${command} - ${action}`);
                
                const response = await fetch(`${ESP32_URL}/api/command`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command, action })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Command executed: ${command} - ${action}`, 'success');
                } else {
                    log(`❌ Command failed: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function getStatus() {
            try {
                log('Fetching device status...');
                
                const response = await fetch(`${ESP32_URL}/api/status`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('status').textContent = data.status;
                    document.getElementById('deviceId').textContent = data.device_id;
                    document.getElementById('uptime').textContent = `${Math.floor(data.uptime / 1000)}s`;
                    document.getElementById('memory').textContent = `${data.free_memory} bytes`;
                    
                    log('✅ Status updated', 'success');
                } else {
                    log('❌ Failed to get status', 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function getSensorData() {
            try {
                log('Reading sensor data...');
                
                const response = await fetch(`${ESP32_URL}/api/sensor`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('temperature').textContent = `${data.temperature.toFixed(1)}°C`;
                    document.getElementById('humidity').textContent = `${data.humidity.toFixed(1)}%`;
                    
                    log(`✅ Sensor data: T=${data.temperature.toFixed(1)}°C, H=${data.humidity.toFixed(1)}%`, 'success');
                } else {
                    log('❌ Failed to read sensors', 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function sendCustomData() {
            try {
                const customData = document.getElementById('customData').value.trim();
                
                if (!customData) {
                    log('❌ Please enter data to send', 'error');
                    return;
                }
                
                // Validate JSON
                JSON.parse(customData);
                
                log('Sending custom data...');
                
                const response = await fetch(`${ESP32_URL}/api/data`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: customData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Custom data sent successfully', 'success');
                } else {
                    log(`❌ Failed to send data: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Auto-refresh status every 5 seconds
        setInterval(getStatus, 5000);
        
        // Initial status fetch
        getStatus();
    </script>
</body>
</html>
